<!doctype html>
<html lang="hy">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Գրիգորի Նարեկայ վանից վանականի մատեան ողբերգութեան" />
    <meta
      name="theme-color"
      content="oklch(96.5% 0.018 90)"
      media="(prefers-color-scheme: light)"
    />
    <meta name="theme-color" content="oklch(15% 0.024 66)" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/src/assets/fonts/artarumian-grqi-nor-regular.v3.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <title>Մատեան ողբերգութեան</title>
  </head>
  <body class="bg-background text-foreground px-4 py-8">
    <div id="root" class="flex flex-col items-center">
      <style>
        @media (prefers-color-scheme: light) {
          body {
            background-color: oklch(96.5% 0.018 90);
            color: oklch(27% 0.03 55);
          }
        }
        @media (prefers-color-scheme: dark) {
          body {
            background-color: oklch(15% 0.024 66);
            color: oklch(86% 0.03 84);
          }
        }
        body {
          font-family: 'Google Sans', ui-sans-serif, sans-serif;
          margin: 0;
        }
        noscript {
          padding: 2rem;
          max-width: 40rem;
        }
        .splash {
          align-items: center;
          display: flex;
          flex-flow: column;
          height: 100vh;
          justify-content: center;
        }
        .spinner {
          height: 4rem;
          width: 4rem;
        }
      </style>
      <div class="splash">
        <img alt="Բեռնվում է…" class="spinner" src="/spinner.svg" />
        <noscript>JavaScript-ն անջատված է։ Միացրեք այն կամ փորձեք այլ բրաուզեր։</noscript>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
