name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    environment:
      name: production
      url: https://narek.page
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Download fonts
        run: curl -fsSLOJ --output-dir ./src/assets/fonts "${{ vars.FONTS_URL }}/artarumian-grqi-nor-regular.v3.woff2" --create-dirs

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: |
          npm run books
          npm run books:check
          npm run lint
          npm run fmt:check
          npm run test

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
