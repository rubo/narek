name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Download fonts
        run: curl -fsSLOJ --create-dirs --output-dir ./public/fonts "${{ vars.FONTS_URL }}"

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: |
          npm run books
          npm run books:check
          npm run lint
          npm run fmt:check
          npm run test

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_build_command: npm run build
          app_location: /
          output_location: dist
