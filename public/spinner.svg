      transform-origin: center;
      animation: spin 3s linear infinite;
    }
    .left {
      display: none;
    }
    @keyframes appear {
      to {
        opacity: 1;
      }
    }
    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      svg {
        opacity: 1;
        animation: none;
      }
      g {
        animation: none;
      }
    }
    @media (prefers-color-scheme: light) {
      g {
        fill: oklch(27% 0.03 55);
      }
    }
    @media (prefers-color-scheme: dark) {
      g {
        fill: oklch(86% 0.03 84);
      }
      .left {
        display: unset;
      }
      .right {
        display: none;
      }
      @keyframes spin {
        to {
          transform: rotate(-360deg);
        }
      }
    }
  </style>
